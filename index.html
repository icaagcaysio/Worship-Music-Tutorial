<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Worship Band">
<meta name="theme-color" content="#1d1b4f"><title>Worship Band Starter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1b4f'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23f5b942'/%3E%3C/svg%3E">
<link id="ai" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231d1b4f'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23f5b942'/%3E%3C/svg%3E">
<style>
:root{--p:#1d1b4f;--a:#f5b942;--bg:#eef0f8;--ink:#14142b;--tl:#9b2457;--pk:#e0457b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--p);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.15rem;margin:0;letter-spacing:.2px}
button{font:inherit;min-height:48px;padding:8px 14px;border:2px solid var(--p);border-radius:12px;background:var(--p);color:#fff;cursor:pointer}
button.alt{background:#fff;color:var(--p)}
button.on,button.alt.on{background:var(--a);color:#000;border-color:var(--a);font-weight:700}
header button{background:#fff;color:var(--p);border-color:#fff;font-weight:700}
header button.on{background:var(--a);border-color:var(--a)}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px #0002}
nav button{flex:none}
main{padding:12px;max-width:760px;margin:auto}
.pane{display:none}.pane.on{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin:0 0 12px;border-left:6px solid var(--a)}
h2{margin:.2em 0;font-size:1.3rem}h3{margin:.7em 0 .2em;font-size:1.05rem}
ul{padding-left:20px}li{margin:6px 0}
.tl{display:none}body.tl .tl{display:block;color:var(--tl);font-size:.93em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.dots{display:flex;gap:10px;justify-content:center;margin:12px 0}
.dot{width:58px;height:58px;border-radius:50%;background:#d8d9ee;display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.dot.f{background:var(--a)}.dot.f1{background:var(--pk);color:#fff}
svg{max-width:100%;height:auto}
.chords{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gs{width:96px;cursor:pointer;background:#fff}
.grid{display:grid;grid-template-columns:54px repeat(8,1fr);gap:4px;margin:8px 0}
.grid b{font-size:.8rem;align-self:center}
.grid button{min-height:42px;padding:0;background:#dde;border-color:#dde}
.grid button.x{background:var(--p);border-color:var(--p)}.grid button.cur{outline:3px solid var(--pk)}
.cell{width:36px;height:36px;border-radius:8px;background:#d8d9ee;display:grid;place-items:center;font-size:.85rem}.cell.f{background:var(--a)}
.eb{display:block;width:100%;text-align:left;margin:4px 0;background:#fff;color:var(--ink);border-color:#c9cbe6;position:relative;overflow:hidden}
.eb i{position:absolute;left:0;top:0;bottom:0;background:#f5b94277;z-index:0}.eb span{position:relative}
input[type=range]{width:100%;height:36px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;vertical-align:middle;margin-right:8px}
.q label{display:block;padding:6px 0}
.wk{display:none}.wk.on{display:block}
.pr{display:none}
@media print{header,nav,.np{display:none!important}.pane{display:none!important}.pane.on{display:block!important}.wk{display:block!important}.qz{display:none}.card{border:1px solid #999;break-inside:avoid}body{background:#fff}.pr{display:block}.tl{display:block!important}}
</style></head><body>
<header><h1>Worship Band Starter</h1></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const T=(e,t)=>`<span>${e}</span><span class=tl>${t}</span>`;
const li=a=>'<ul>'+a.map(x=>`<li>${T(x[0],x[1])}</li>`).join('')+'</ul>';
function tgl(){const o=document.body.classList.toggle('tl');$('#tgb').textContent='Tagalog: '+(o?'ON':'OFF');$('#tgb').classList.toggle('on',o)}
/* ---------- audio ---------- */
let A;const hz=m=>440*2**((m-69)/12),later=(t,f)=>setTimeout(f,Math.max(0,(t-A.currentTime)*1000));
function ac(){if(!A)A=new(window.AudioContext||window.webkitAudioContext)();if(A.state=='suspended')A.resume();return A}
function tone(m,t,d,ty,v){const o=A.createOscillator(),g=A.createGain();o.type=ty;o.frequency.value=hz(m);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,f){const n=A.sampleRate*d|0,b=A.createBuffer(1,n,A.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=A.createBufferSource(),fl=A.createBiquadFilter(),g=A.createGain();s.buffer=b;fl.type='highpass';fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(A.destination);s.start(t)}
function kick(t){const o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+.3)}
const snare=t=>noise(t,.15,.5,1200),hat=t=>noise(t,.04,.25,7000);
function tom(t,v){const o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(65,t+.2);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+.4)}
function fx(){ac();const t=A.currentTime+.1;for(let i=0;i<8;i++)tom(t+i*.375,.25+i*.1);noise(t+3,1.8,.6,4000)}
const TR={id:0};
function play(o,cb,bf,dv,end){if(TR.id&&TR.o==o){stop();return}stop();ac();TR.o=o;TR.end=end;TR.bf=bf;TR.n=A.currentTime+.08;TR.s=0;TR.id=setInterval(()=>{while(TR.n<A.currentTime+.12){cb(TR.s++,TR.n);TR.n+=60/TR.bf()/dv}},25);lbl()}
function stop(){if(TR.id){clearInterval(TR.id);TR.id=0;TR.end&&TR.end()}lbl()}
function lbl(){$$('.pl').forEach(b=>b.textContent=TR.id&&b.dataset.p==TR.o?'■ Stop':'▶ Play')}
/* ---------- data ---------- */
const O=[40,45,50,55,59,64];
/* f=frets low E..high e (-1 muted); k=piano notes; b=[bass sound midi, string idx 3=E 2=A, fret] */
const C={G:{f:[3,2,0,0,0,3],k:[55,59,62],b:[43,3,3]},D:{f:[-1,-1,0,2,3,2],k:[54,57,62],b:[50,2,5]},Em7:{f:[0,2,0,0,0,0],k:[52,55,59,62],b:[40,3,0]},Cadd9:{f:[-1,3,2,0,3,3],k:[60,62,64,67],b:[48,2,3]},C:{f:[-1,3,2,0,1,0],k:[55,60,64],b:[48,2,3]},Fmaj7:{f:[-1,-1,3,2,1,0],k:[53,57,60,64],b:[41,3,1]},Am7:{f:[-1,0,2,0,1,0],k:[57,60,64,67],b:[45,2,0]}};
const RT={G:[3,10],C:[8,3],E:[0,7],D:[10,5],A:[5,0]};
const KS={G:['G','C','D','Em'],C:['C','F','G','Am'],D:['D','G','A','Bm'],E:['E','A','B','C#m']};
const NM=[['1','Home','Tahanan: payapa, parang nakauwi ka na.'],['4','Lift','Pag-angat: bukas at magaan.'],['5','Tension','Tensyon: parang gustong umuwi sa 1.'],['6m','Reflect','Mapagnilay: malambot, medyo malungkot.']];
const SS=[['Intro',1,'Soft pad or fingerpicked guitar sets the mood. Drums wait or play very lightly.','Mahina: pad o dahan-dahang gitara. Hintay muna ang drums.'],['Verse',2,'Quiet and simple, like telling a story. Light hi-hat, soft strums, bass on beat 1.','Tahimik at simple, parang nagkukuwento. Mahinang hi-hat at strum.'],['Pre-Chorus',3,'Energy starts to climb. Add more notes and a little more volume.','Unti-unting lumalakas. Dagdag na tugtog at lakas.'],['Chorus',5,'Full band, biggest sound. Everyone sings!','Buong banda, pinakamalakas. Sabay-sabay ang pag-awit!'],['Bridge',4,'Builds up, may drop to soft first. Floor-tom builds and cymbal swells.','Pataas na pataas, minsan biglang hina muna. Floor tom build at cymbal swell.'],['Outro',1,'Wind down. Soft pad, let the last chord ring.','Pababa na. Mahinang pad, hayaang tumunog ang huling chord.']];
let PAT,ON={g:1,k:1,b:1,d:1},SK='G',SQ=0,CUR='';
const mkPat=()=>PAT={h:[1,1,1,1,1,1,1,1],s:[0,0,1,0,0,0,1,0],k:[1,0,0,0,1,0,0,0]};mkPat();
/* ---------- SVG builders ---------- */
function gSVG(n){const f=C[n].f;let s=`<svg class=gs viewBox="0 0 100 125" onclick="strum('${n}')"><text x=50 y=12 text-anchor=middle font-size=14 font-weight=700>${n}</text><line x1=15 x2=85 y1=30 y2=30 stroke=#000 stroke-width=4 />`;
for(let j=1;j<=4;j++)s+=`<line x1=15 x2=85 y1=${30+j*20} y2=${30+j*20} stroke=#888 />`;
for(let i=0;i<6;i++){const x=15+i*14,v=f[i];s+=`<line x1=${x} x2=${x} y1=30 y2=110 stroke=#444 />`;
if(v<0)s+=`<text x=${x} y=26 text-anchor=middle font-size=11>x</text>`;else if(v==0)s+=`<circle cx=${x} cy=22 r=3.5 fill=none stroke=#000 />`;else s+=`<circle cx=${x} cy=${20+v*20} r=7 fill=#1d1b4f />`}
return s+'</svg>'}
const cg=a=>`<div class=chords>${a.map(gSVG).join('')}</div>`;
function pSVG(hl){const W=[0,2,4,5,7,9,11];let w='',b='',i=0;for(let m=48;m<72;m++){const pc=m%12,on=hl.includes(m);
if(W.includes(pc)){w+=`<rect x=${i*22} y=0 width=22 height=100 fill=${on?'#f5b942':'#fff'} stroke=#000 onclick="pn(${m})" />`+(pc==0?`<text x=${i*22+11} y=94 text-anchor=middle font-size=8 pointer-events=none>${m==60?'Mid-C':'C'}</text>`:'');i++}
else b+=`<rect x=${i*22-7} y=0 width=14 height=60 fill=${on?'#e0457b':'#111'} onclick="pn(${m})" />`}
return `<svg viewBox="0 0 308 100">${w}${b}</svg>`}
function bSVG(d){let s='<svg viewBox="0 0 340 95">';for(let f=0;f<=12;f++)s+=`<line x1=${30+f*25} x2=${30+f*25} y1=12 y2=72 stroke=${f?'#aaa':'#000'} stroke-width=${f?1:4} />`+([3,5,7,9,12].includes(f)?`<text x=${17.5+f*25} y=88 text-anchor=middle font-size=10>${f}</text>`:'');
['G','D','A','E'].forEach((n,i)=>s+=`<line x1=30 x2=330 y1=${15+i*19} y2=${15+i*19} stroke=#444 stroke-width=${1+i*.6} /><text x=8 y=${19+i*19} font-size=12 text-anchor=middle>${n}</text>`);
d.forEach(([i,f])=>s+=`<circle cx=${f?17.5+f*25:22} cy=${15+i*19} r=7 fill=#e0457b />`);return s+'</svg>'}
/* ---------- instruments' interactions ---------- */
function strum(n){ac();const t=A.currentTime;C[n].f.forEach((f,i)=>f>=0&&tone(O[i]+f,t+i*.025,1.5,'triangle',.15))}
function pn(m){ac();tone(m,A.currentTime,1.2,'triangle',.3)}
function kc(n){ac();const d=C[n];$('#pk').innerHTML=pSVG(d.k);d.k.forEach(m=>tone(m,A.currentTime,1.5,'triangle',.2))}
function bk(k,el){$$('.bk').forEach(b=>b.classList.toggle('on',b.textContent==k));const[e,a]=RT[k];$('#bf').innerHTML=bSVG([[3,e],[2,a]])+`<p>${T(`Root ${k}: E string fret ${e}, A string fret ${a} (0 = open string)`,`Root ${k}: E string fret ${e}, A string fret ${a} (0 = bukas na kuwerdas)`)}</p>`;ac();tone(40+e,A.currentTime,1,'triangle',.4)}
function dg(){return '<div class=grid><span></span>'+[...'1&2&3&4&'].map(x=>`<b>${x}</b>`).join('')+[['h','Hi-Hat'],['s','Snare'],['k','Kick']].map(([r,n])=>`<b>${n}</b>`+PAT[r].map((v,i)=>`<button data-c=${i} class="${v?'x':''}" onclick="tgp('${r}',${i},this)"></button>`).join('')).join('')+'</div>'}
function tgp(r,i,b){ac();PAT[r][i]^=1;b.classList.toggle('x');if(PAT[r][i])({h:hat,s:snare,k:kick})[r](A.currentTime)}
function drum(st,t){if(PAT.h[st])hat(t);if(PAT.s[st])snare(t);if(PAT.k[st])kick(t)}
function rst(){mkPat();$('#dgw').innerHTML=dg()}
/* ---------- metronome ---------- */
function metro(){play('m',(s,t)=>{const b=s%4;tone(b?76:88,t,.06,'square',.12);later(t,()=>$$('.dot').forEach((d,i)=>d.className='dot'+(i==b?(b?' f':' f1'):'')))},()=>+$('#bp').value,1,()=>$$('.dot').forEach(d=>d.className='dot'))}
let tp=[];function tap(){const n=performance.now();if(tp.length&&n-tp[tp.length-1]>2000)tp=[];tp.push(n);tp=tp.slice(-5);if(tp.length>1){const v=Math.max(60,Math.min(140,Math.round(60000/((tp[tp.length-1]-tp[0])/(tp.length-1)))));$('#bp').value=v;$('#bv').textContent=v}}
function nash(k){$$('.kb').forEach(b=>b.classList.toggle('on',b.textContent==k));const c=KS[k];
$('#nn').innerHTML=`<div class=chords>${NM.map((n,i)=>`<div class=card style="min-width:140px;text-align:center"><h2>${n[0]} = ${c[i]}</h2>${T(n[1],n[2])}</div>`).join('')}</div>`+[[0,2,3,1],[1,0,2,3]].map(p=>`<p><b>${p.map(i=>NM[i][0]).join(' - ')}</b> = ${p.map(i=>c[i]).join(' - ')}</p>`).join('')}
function sec(i){$('#sd').innerHTML=`<b>${SS[i][0]}</b>`+T(SS[i][2],SS[i][3])}
/* ---------- band simulator ---------- */
const PR=[[0,2,3,1],[1,0,2,3]],KN={G:['G','Cadd9','D','Em7'],C:['C','Fmaj7','G','Am7']},sp=()=>PR[SQ].map(i=>KN[SK][i]);
function panel(c){const d=C[c];let h=`<h2 style="text-align:center">${c}</h2><div class=chords>`;if(ON.g)h+=gSVG(c);if(ON.k)h+=`<div style="width:100%">${pSVG(d.k)}</div>`;if(ON.b)h+=`<div style="width:100%">${bSVG([[d.b[1],d.b[2]]])}<p>Bass root: ${d.b[1]==3?'E':'A'} string, fret ${d.b[2]}</p></div>`;h+='</div>';if(ON.d)h+='<div class=row id=ds>'+[...'1&2&3&4&'].map((x,i)=>`<div class=cell>${x}</div>`).join('')+'</div>';return h}
function sim(){play('s',(s,t)=>{const st=s%8,c=sp()[(s>>3)%4],d=C[c],q=60/+$('#sp').value/2;
if(ON.d)drum(st,t);if(ON.b&&st%4==0)tone(d.b[0],t,q*3.5,'triangle',.45);
if(ON.g&&st%2==0)d.f.forEach((f,i)=>f>=0&&tone(O[i]+f,t+i*.015,q*2,'triangle',.07));
if(ON.k&&st==0)d.k.forEach(m=>tone(m,t,q*8,'sine',.07));
later(t,()=>{if(st==0||CUR!=c){CUR=c;$('#bt').innerHTML=panel(c)}$$('#ds .cell').forEach((e,i)=>e.classList.toggle('f',i==st))})},()=>+$('#sp').value,2,()=>{CUR=''})}
function sgl(i,b){ON[i]=!ON[i];b.classList.toggle('on');if(CUR)$('#bt').innerHTML=panel(CUR)}
/* ---------- quizzes ---------- */
const Q={g:[['What does an X above a chord box mean?',['Play it loud','Do not strum that string','Press hard'],1],['G, Cadd9, Em7 and D belong to which key?',['Key of G','Key of E','Key of A'],0]],
k:[['Where is Middle C?',['Left of a pair of black keys, near the middle','Far right end','Far left end'],0],['How many notes are in a triad?',['2','3','5'],1]],
b:[['Which bass string is thickest and lowest?',['G','D','E'],2],['Who does the bass lock in with?',['The kick drum','Nobody','Only the hi-hat'],0]],
d:[['In the Money Beat, the snare plays on:',['1 and 3','2 and 4','Every 8th note'],1],['The hi-hat plays:',['8th notes','Only beat 1','Never'],0]]};
function quiz(id){return `<div class=card><h3>${T('Ready for Rehearsal?','Handa ka na ba sa Praktis?')}</h3>`+Q[id].map((q,i)=>`<div class=q><b>${q[0]}</b>`+q[1].map((o,j)=>`<label><input type=radio name=${id}${i} value=${j}>${o}</label>`).join('')+'</div>').join('')+`<button onclick="chk('${id}')">Check answers</button><p id=r${id}></p></div>`}
function chk(id){let s=0,w=[];Q[id].forEach((q,i)=>{const c=$(`input[name=${id}${i}]:checked`);if(c&&+c.value==q[2])s++;else w.push(`Q${i+1}: ${q[1][q[2]]}`)});$('#r'+id).textContent=s==Q[id].length?'Ready! Handa ka na!':`${s}/${Q[id].length}. Correct answers: ${w.join(' | ')}. Review and try again. Kaya mo ito!`}
/* ---------- panes ---------- */
const WT=['Week 1: First Steps','Week 2-3: Basic Worship Patterns','Week 4: Playing With the Band'];
function inst(id,ws,pr){return `<section class=pane id=p-${id}><div class="row np">${WT.map((t,i)=>`<button class="alt${i?'':' on'}" onclick="wk('${id}',${i},this)">${t}</button>`).join('')}</div>`+ws.map((w,i)=>`<div class="wk card${i?'':' on'}">${w}</div>`).join('')+`<div class=card><h3>${T('Practice drills and common mistakes','Mga drills at karaniwang pagkakamali')}</h3>${li(X[id])}</div><div class=pr><div class=card>${T('Before rehearsal: tune up, watch the leader, leave space for others, bring this sheet.','Bago magpraktis: mag-tune, tumingin sa lider, mag-iwan ng espasyo, dalhin ang sheet na ito.')}</div></div><button class=np onclick="print()">Print Cheat Sheet</button><div class="qz" style="margin-top:12px">${quiz(id)}</div></section>`}
function wk(id,i,b){const p=$('#p-'+id);$$('#p-'+id+' .wk').forEach((w,j)=>w.classList.toggle('on',i==j));$$('#p-'+id+' .row button').forEach(x=>x.classList.toggle('on',x==b))}
const P={};
P.basics=`<section class=pane id=p-basics>
<div class=card><h2>${T('Rhythm and Beat','Ritmo at Tempo')}</h2>${T('The beat is the steady pulse of a song, like your heartbeat or tapping your foot. In 4/4 time we count 1-2-3-4 and start again. Beat 1 is the strongest. When everyone feels the same beat, the band is "locked in". Tempo (BPM) = how fast the beats go.','Ang beat ay tuloy-tuloy na tibok ng kanta, parang tibok ng puso o pagpadyak ng paa. Bilang: 1-2-3-4, ulit. Kapag iisa ang pakiramdam ng buong banda sa beat, sabay-sabay kayo. Ang tempo ay bilis ng beat.')}
<div class=dots>${[1,2,3,4].map(n=>`<div class=dot>${n}</div>`).join('')}</div>
<input type=range id=bp min=60 max=140 value=90 oninput="$('#bv').textContent=this.value"><b><span id=bv>90</span> BPM</b>
<div class=row><button class=pl data-p=m onclick=metro()>▶ Play</button><button class=alt onclick=tap()>Tap Tempo</button></div></div>
<div class=card><h3>Plain-language words / Mga salita</h3>${li([['Tempo / Timing: how fast the song moves.','Tempo / Timing: bilis ng kanta; parang sabay-sabay na pagmamartsa.'],['Root note: the note a chord is named after, the foundation of the house.','Root note: ugat ng chord, ang pundasyon ng bahay.'],['Chord progression: chords in a repeating order, like dance steps.','Chord progression: sunod-sunod na chords, parang hakbang sa sayaw.'],['Dynamics: how soft or loud we play.','Dynamics: hina at lakas ng tugtog, mahina sa verse, malakas sa chorus.']])}</div>
<div class=card><h2>${T('The Number System','Sistema ng Numero')}</h2>${T('Instead of letter names, bands use numbers so a song is easy to move to any key. 1 is the home chord. Pick a key:','Gumagamit ang banda ng numero para madaling ilipat ang kanta sa ibang key. Ang 1 ang "home" na chord. Pumili ng key:')}
<div class=row>${Object.keys(KS).map(k=>`<button class="alt kb" onclick="nash('${k}')">${k}</button>`).join('')}</div><div id=nn></div></div>
<div class=card><h2>${T('Song Dynamics and Structure','Dynamics at Estruktura ng Kanta')}</h2>${T('Tap a section. The bar shows how much energy the band plays with.','Pindutin ang bahagi. Ipinapakita ng bar ang lakas ng tugtog.')}${SS.map((s,i)=>`<button class="eb" onclick="sec(${i})"><i style="width:${s[1]*20}%"></i><span>${s[0]}</span></button>`).join('')}<p id=sd></p></div></section>`;
const gw=[`<h3>Week 1: First Steps</h3>`+li([['Parts: head (tuning pegs), neck (frets are the metal lines), body. Strings, thick to thin: E A D G B E.','Bahagi: ulo, leeg (fret ang guhit na metal), katawan. Ang string ay kuwerdas.'],['Chord box: a picture of the neck. Vertical lines are strings, horizontal lines are frets, dots are fingers, O = ring open, X = do not strum.','Chord box: larawan ng leeg. Tuldok = daliri, O = bukas, X = huwag tugtugin.'],['Press just behind the fret with your fingertip. Short nails help.','Pindutin sa likod mismo ng fret gamit ang dulo ng daliri.']])+`<h3>Worship 4 in G (tap to hear)</h3>`+cg(['G','Cadd9','Em7','D']),
`<h3>Key of C chords (tap to hear)</h3>`+cg(['C','Fmaj7','Am7','G'])+li([['Strum 8ths: count 1 & 2 & 3 & 4 &. Down on numbers, up on the &. Start with D . D U . U D U (the dot = arm moves, no strings hit).','Strum: pababa sa numero, pataas sa &. Ang tuldok ay galaw ng braso na hindi tumatama.'],['Capo: a clamp on the neck that raises the pitch so you keep easy shapes. C shapes + capo fret 2 = key of D; fret 4 = key of E.','Capo: panipit sa leeg na nagtataas ng tono, pareho pa rin ang hugis ng daliri.']]),
li([['Verses: soft strums or fingerpicking. Choruses: fuller strumming.','Verse: mahina. Chorus: mas malakas.'],['Watch the leader. Change chords on beat 1 of the next bar.','Tumingin sa lider; magpalit sa beat 1.'],['Leave space for keys. Fewer strings is fine.','Mag-iwan ng espasyo para sa iba.']])+`<p>Try the Band tab to practice along.</p>`];
const kw=[`<h3>Week 1: First Steps</h3>`+li([['Middle C: the white key just left of a pair of two black keys near the middle. Tap it!','Middle C: puting key sa kaliwa ng dalawang itim, malapit sa gitna.'],['Octave: the same note name 8 white keys later, higher or lower in pitch.','Octave: parehong pangalan ng nota pero mas mataas o mababa.']])+pSVG([60]),
`<h3>Week 2-3: Triads and inversions</h3>`+li([['Triad = 3-note chord. Skip every other white key: C-E-G is C.','Triad = tatlong notang sabay; laktawan ang bawat isang key.'],['Left hand: the root (chord-name note) alone or as an octave. Right hand: the triad.','Kaliwa: ugat ng chord. Kanan: triad.'],['Inversions: use the shape closest to your hand so it does not jump. Example: G (G-B-D) then C as G-C-E. Tap chords:','Inversion: piliin ang pinakamalapit na hugis para hindi lumulundag ang kamay.']])+`<div class=row>${Object.keys(C).map(n=>`<button class=alt onclick="kc('${n}')">${n}</button>`).join('')}</div><div id=pk>${pSVG([])}</div>`,
li([['Pads: hold chords long and soft for verses.','Pad: mahaba at mahinang chords.'],['Rhythmic chording: short chords on each beat for choruses.','Rhythmic: maiikling chords sa bawat beat.'],['Play in the middle of the keyboard. Leave low notes to the bass.','Huwag sa sobrang baba; para sa bass iyon.']])];
const bw=[`<h3>Week 1: First Steps</h3>`+li([['Role: the bass bridges rhythm (drums) and harmony (chords). Without it the band sounds thin.','Tulay ng ritmo (drums) at harmonya (chords).'],['Strings, thick to thin (low to high): E A D G.','Makapal hanggang manipis: E A D G.'],['Root notes: the note named like the chord. Pick a key to see where it lives:','Root note: ugat ng chord. Pumili ng key:']])+`<div class=row>${Object.keys(RT).map(k=>`<button class="alt bk" onclick="bk('${k}')">${k}</button>`).join('')}</div><div id=bf>${bSVG([])}</div>`,
li([['Play the root on beats 1 and 3, together with the kick drum. Long notes in verses.','Tumugtog ng root sa 1 at 3, kasabay ng kick.'],['Muting: fretting fingers lightly touch unused strings, and your thumb rests on the string above. Clean and quiet.','Muting: dumampi sa mga di ginagamit na kuwerdas para walang ingay.']]),
li([['Lock with the drummer: kick and bass hit together. Look at each other!','Sabay ang kick at bass. Magtinginan.'],['Root notes only at first. Simple is strong.','Root lang muna.'],['Play less in verses, more in choruses.','Kaunti sa verse, mas marami sa chorus.']])];
const dw=[`<h3>Week 1: First Steps</h3>`+li([['Kit: Kick (foot pedal, big drum), Snare (sharp crack), Hi-Hat (two small cymbals), Ride (steady cymbal), Crash (loud splash), Toms (high and floor).','Kick: malaking tambol sa paa. Snare: matunog. Hi-Hat: dalawang maliit na cymbal. Ride: tuloy-tuloy. Crash: malakas. Toms: mataas at floor.'],['Grip: hold the stick a third from the end, pinch with thumb and first finger, other fingers loose. Let it bounce back.','Hawak: isang-katlo mula sa dulo, ipit ng hinlalaki at hintuturo, maluwag ang iba, hayaang tumalbog.']])+`<h3>Tap the kit to hear each drum</h3>`+kitSVG(),
`<h3>The Money Beat</h3>${T('8th notes on hi-hat, kick on 1 and 3, snare on 2 and 4. Tap squares, then Play (uses the tempo from the Basics tab).','8th notes sa hi-hat, kick sa 1 at 3, snare sa 2 at 4. Pindutin ang squares, tapos Play (sumusunod sa tempo sa Basics).')}<div id=dgw>${dg()}</div><div class=row><button class=pl data-p=d onclick="play('d',(s,t)=>{const st=s%8;drum(st,t);later(t,()=>$$('.grid button').forEach(b=>b.classList.toggle('cur',b.dataset.c==st)))},()=>+$('#bp').value,2,()=>$$('.grid button').forEach(b=>b.classList.remove('cur')))">▶ Play</button><button class=alt onclick=rst()>Reset</button></div>`,
li([['Bridge builds: hit the floor tom on every beat, a little louder each bar.','Bridge build: palo sa floor tom bawat beat, palakas nang palakas.'],['Fill: a short run on the last beat before a new section, then crash on beat 1.','Fill: maikling palo sa huling beat bago ang bagong bahagi, tapos crash sa beat 1.'],['Cymbal swell: a soft cymbal roll that slowly grows.','Cymbal swell: mahinang roll na unti-unting lumalakas.']])+`<button onclick=fx()>Hear a tom build + crash</button>`];
Q.g.push(['Which spot on the string sounds clearest?',['Right on top of the fret','Just behind the fret','Far from the fret'],1],['What does a capo do?',['Makes strings thicker','Raises the pitch','Tunes the guitar'],1]);
Q.k.push(['What is an octave?',['Same note name 8 white keys away','Three notes together','A loud chord'],0],['Why use inversions?',['So your hand moves less','To play louder','To change key'],0]);
Q.b.push(['Root C on the A string is at fret:',['3','5','7'],0],['What does muting do?',['Stops unwanted string noise','Makes you louder','Raises pitch'],0]);
Q.d.push(['Which drum is the big one played with the foot?',['Snare','Kick','Ride'],1],['Why keep the hi-hat softer than the snare?',['So the backbeat stays clear','Hi-hat is broken','No reason'],0]);

const X={g:[['Buzzing? Press closer to the fret and use fingertips, not finger pads.','Kung may buzz, idiin malapit sa fret gamit ang dulo ng daliri.'],['One-minute changes: switch G to Cadd9 as many times as you can in 60 seconds, slowly and cleanly.','Isang-minutong palitan: G papuntang Cadd9, malinis at mabagal.'],['Practice strumming on muted strings first, so only your hand rhythm is trained.','Mag-strum muna sa naka-mute na kuwerdas para sanayin ang kamay.']],
k:[['Find every C on the keyboard. Then play Middle C and its octave.','Hanapin lahat ng C, at i-play ang Middle C at octave nito.'],['Triad hop: play G, C, D using the closest shapes at 70 BPM without lifting your whole hand.','Triad hop: G, C, D gamit ang pinakamalapit na hugis, 70 BPM.'],['Keep wrists relaxed and fingers curved, like holding a small ball.','Relaks ang pulso at kurba ang daliri, parang may hawak na maliit na bola.']],
b:[['Drill: root on beat 1 only, for 4 bars with the metronome. Then add beat 3.','Drill: root sa beat 1 lang, 4 na bar, may metronome. Idagdag ang beat 3.'],['Use two plucking fingers (index, middle) and alternate them for an even tone.','Gamitin ang hintuturo at gitnang daliri nang salitan.'],['Kick hunt: in the Band tab, turn on Drums and Bass and match every kick hit.','Sa Band tab, i-on ang Drums at Bass at sabayan ang kick.']],
d:[['Hi-hat alone for 2 minutes at 70 BPM. Then add the kick, then the snare.','Hi-hat lang, 2 minuto, 70 BPM. Isunod ang kick, tapos snare.'],['Count out loud: 1 & 2 & 3 & 4 &. Counting keeps you steady.','Bilangin nang malakas para steady.'],['No drums at home? Practice on a pillow or book with sticks. Keep hi-hat softer than snare.','Walang drums? Unan o libro ang praktisan. Mas mahina ang hi-hat kaysa snare.']]};
function ds(x){ac();const t=A.currentTime;({k:()=>kick(t),s:()=>snare(t),h:()=>hat(t),t:()=>tom(t,.5),f:()=>tom(t,.7),c:()=>noise(t,1.5,.5,4000),r:()=>noise(t,.5,.3,6000)})[x]()}
function kitSVG(){const e=[['c','Crash',70,25,22],['h','Hi-Hat',35,70,20],['t','Tom',125,50,20],['t','Tom',175,50,20],['r','Ride',255,40,26],['s','Snare',85,110,24],['f','Floor Tom',235,115,28],['k','Kick',150,140,32]];return `<svg viewBox="0 0 300 180">${e.map(([k,n,x,y,r])=>`<g onclick="ds('${k}')" style="cursor:pointer"><circle cx=${x} cy=${y} r=${r} fill=#f5b942 stroke=#1d1b4f stroke-width=2 /><text x=${x} y=${y+3} text-anchor=middle font-size=8>${n}</text></g>`).join('')}</svg>`}
const EC={'1':[55,59,62],'4':[60,64,67],'5':[62,66,69],'6m':[52,55,59]};let EQ;
function ep(n){ac();EC[n].forEach(m=>tone(m,A.currentTime,1.6,'triangle',.15))}
function en(){EQ=['1','4','5','6m'][Math.random()*4|0];ep('1');setTimeout(()=>ep(EQ),1800);$('#er').textContent='Listening: first the 1 chord (home), then the mystery chord...'}
function ea(n){if(!EQ)return;$('#er').textContent=n==EQ?'Correct! Tama! Press Play for a new one.':'Not quite, it was '+EQ+'. Listen again and compare.';if(n!=EQ){ep(n);setTimeout(()=>ep(EQ),1800)}else EQ=0}
P.learn=`<section class=pane id=p-learn><h2>Learn the Basics</h2>
<div class=card><h3>${T('A 10-minute practice routine','10-minutong praktis')}</h3>${li([['1. Tune up (1 min). A tuned instrument sounds right even when you play right.','1. Mag-tune muna (1 min).'],['2. Warm up with the metronome at 70 BPM (2 min).','2. Warm-up sa metronome, 70 BPM (2 min).'],['3. Learn ONE new thing, slowly (4 min). Slow and clean beats fast and messy.','3. Isang bagong bagay lang, mabagal (4 min).'],['4. Play along in the Band tab (2 min).','4. Tumugtog kasabay ng Band tab (2 min).'],['5. Rest and pray. Short daily practice beats one long night.','5. Magpahinga at manalangin. Mas mabuti ang maikli pero araw-araw.']])}</div>
<div class=card><h3>${T('Reading a chord chart','Pagbasa ng chord chart')}</h3>${T('Each | marks a bar (one count of 1-2-3-4). The chord shown is played for that whole bar.','Ang bawat | ay isang bar (isang bilang na 1-2-3-4). Ang chord ay tinutugtog sa buong bar.')}<p style="font:700 1.1rem monospace">Verse: | G | D | Em7 | Cadd9 |<br>Chorus: | Cadd9 | G | D | Em7 |</p>${T('Same shape repeating = easy to learn. Listen for when the leader repeats or stops.','Paulit-ulit na hugis ang mga ito, kaya madaling matutunan. Making sa hudyat ng lider.')}</div>
<div class=card><h3>${T('How long is a note?','Gaano katagal ang nota?')}</h3>${li([['Whole note: lasts 4 beats (1-2-3-4).','Whole: 4 na beat.'],['Half note: lasts 2 beats.','Half: 2 beat.'],['Quarter note: 1 beat. Plays on each number.','Quarter: 1 beat, sa bawat numero.'],['Eighth note: half a beat. Plays on numbers and the &.','Eighth: kalahating beat, sa numero at sa &.'],['Rest: silence, but keep counting!','Rest: katahimikan, pero ituloy ang bilang!']])}</div>
<div class=card><h3>${T('Ear training: name the chord','Pagsasanay ng tenga')}</h3>${T('Press Play: you hear chord 1 (home), then a mystery chord in Key of G. Tap the number you think it is.','Pindutin ang Play: maririnig ang 1 (home), tapos mystery chord sa Key of G. Hulaan ang numero.')}<div class=row><button onclick=en()>▶ Play</button>${['1','4','5','6m'].map(n=>`<button class=alt onclick="ea('${n}')">${n}</button>`).join('')}</div><p id=er></p>${T('Hints: 4 sounds open and lifting, 5 sounds like it wants to go home, 6m sounds soft and thoughtful.','Tip: ang 4 ay bukas at magaan, ang 5 ay gustong umuwi, ang 6m ay malambot.')}</div>
<div class=card><h3>${T('Glossary','Talasalitaan')}</h3>${li([['Bar (measure): one group of 4 beats.','Bar: isang grupo ng 4 na beat.'],['BPM: beats per minute, the speed.','BPM: bilang ng beat kada minuto.'],['Key: the home family of notes and chords a song lives in.','Key: ang "pamilya" ng mga nota at chords ng kanta.'],['Chord: 2 or more notes at once.','Chord: dalawa o higit pang nota nang sabay.'],['Pad: a soft, held keyboard sound.','Pad: mahabang malambot na tunog ng keyboard.'],['Fill: a short drum flourish between sections.','Fill: maikling palo ng drums sa pagitan ng bahagi.'],['Cue: a signal from the leader (nod, hand sign).','Cue: hudyat ng lider.'],['Downbeat: beat 1 of a bar.','Downbeat: ang beat 1.']])}</div>
<div class=card><h3>${T('Troubleshooting','Kapag may problema')}</h3>${li([['Losing the beat? Slow down 10 BPM and count out loud.','Nawawala sa beat? Bagalan ng 10 BPM at bumilang nang malakas.'],['Fingers hurt? Normal at first. Short sessions, and it gets easier in about 2 weeks.','Masakit ang daliri? Normal sa simula; titigas din sa loob ng mga 2 linggo.'],['Too loud? Listen for the singers first. If you cannot hear them, play softer.','Masyadong malakas? Dapat narinig ang mga umaawit.']])}</div>
<div class="qz">${quiz('l')}</div></section>`;
